fragment SessionUser on User {
  id
  name
  email
  phone
  avatarUrl
  isPlatformAdmin
  memberships {
    id
    role
    status
    commissionBps
    tenant { id name slug currency timezone locale }
  }
}

query Me {
  me { ...SessionUser }
}

mutation Login($input: LoginInput!) {
  login(input: $input) { accessToken refreshToken user { ...SessionUser } }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) { accessToken refreshToken user { ...SessionUser } }
}

mutation RefreshToken($refreshToken: String!) {
  refreshToken(refreshToken: $refreshToken) { accessToken refreshToken user { ...SessionUser } }
}

mutation Logout($refreshToken: String!) {
  logout(refreshToken: $refreshToken)
}

mutation SwitchTenant($tenantId: UUID!) {
  switchTenant(tenantId: $tenantId) { accessToken refreshToken user { ...SessionUser } }
}

mutation ChangePassword($currentPassword: String!, $newPassword: String!) {
  changePassword(currentPassword: $currentPassword, newPassword: $newPassword)
}
