fragment SessionUser on User {
  id
  name
  email
  phone
  avatarUrl
  isPlatformAdmin
  memberships {
    id
    role
    status
    commissionBps
    tenant { id name slug currency timezone locale }
  }
}

query Me {
  me { ...SessionUser }
}

mutation Login($input: LoginInput!) {
  login(input: $input) { accessToken user { ...SessionUser } }
}

mutation Register($input: RegisterInput!) {
  register(input: $input) { accessToken user { ...SessionUser } }
}

# cookie mode: no argument → the API reads the httpOnly cookie; the argument is only used once to
# migrate a Sprint 1 localStorage token. refreshToken is not selected: in cookie mode it is null.
mutation RefreshToken($refreshToken: String) {
  refreshToken(refreshToken: $refreshToken) { accessToken user { ...SessionUser } }
}

mutation Logout {
  logout
}

mutation LogoutAll {
  logoutAll
}

mutation CreateEventsToken {
  createEventsToken
}

mutation SwitchTenant($tenantId: UUID!) {
  switchTenant(tenantId: $tenantId) { accessToken user { ...SessionUser } }
}

mutation ChangePassword($currentPassword: String!, $newPassword: String!) {
  changePassword(currentPassword: $currentPassword, newPassword: $newPassword)
}

query Invite($token: String!) {
  invite(token: $token) { tenantName role inviteeName emailHint phoneHint expiresAt userExists }
}

mutation AcceptInvite($token: String!, $password: String!, $name: String) {
  acceptInvite(token: $token, password: $password, name: $name) { accessToken user { ...SessionUser } }
}
