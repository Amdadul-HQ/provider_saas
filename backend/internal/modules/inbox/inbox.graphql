enum ConversationStatus { OPEN PENDING CLOSED SPAM }
enum MessageDirection { INBOUND OUTBOUND }
enum MessageKind { TEXT IMAGE VIDEO AUDIO FILE STICKER TEMPLATE SYSTEM }
enum TemplateCategory { QUICK_REPLY REMINDER DELIVERY INVOICE WINBACK OTHER }

type Conversation {
  id: UUID!
  socialAccount: SocialAccount! @goField(forceResolver: true)
  customer: Customer @goField(forceResolver: true)
  identity: CustomerIdentity @goField(forceResolver: true)
  platform: SocialPlatform!
  externalThreadId: String!
  status: ConversationStatus!
  assignedTo: User @goField(forceResolver: true)
  unreadCount: Int!
  lastMessageAt: Time
  lastMessagePreview: String
  lastInboundAt: Time
  canReply: Boolean!            # WhatsApp 24h window / Messenger policy
  labels: [String!]!
  messages(page: PageInput): [Message!]! @goField(forceResolver: true)
  createdAt: Time!
}
type Message {
  id: UUID!
  conversationId: UUID!
  direction: MessageDirection!
  externalId: String
  kind: MessageKind!
  body: String
  attachments: JSON!
  sentBy: User @goField(forceResolver: true)
  status: String!
  error: String
  sentAt: Time!
}
type MessageTemplate { id: UUID! key: String! name: String! body: String! category: TemplateCategory! isActive: Boolean! }
type ConversationConnection { edges: [ConversationEdge!]! pageInfo: PageInfo! totalCount: Int! }
type ConversationEdge { cursor: String! node: Conversation! }
type InboxCounts { open: Int! unassigned: Int! mine: Int! unread: Int! }

input ConversationFilter { status: ConversationStatus platform: SocialPlatform socialAccountId: UUID customerId: UUID assignedTo: UUID unassigned: Boolean search: String label: String }
input SendMessageInput { conversationId: UUID! body: String templateId: UUID variables: JSON attachments: JSON }
input MessageTemplateInput { key: String! name: String! body: String! category: TemplateCategory! isActive: Boolean = true }

extend type Query {
  conversations(filter: ConversationFilter, page: PageInput): ConversationConnection! @auth(roles: [OWNER, ADMIN, STAFF, VIEWER])
  conversation(id: UUID!): Conversation @auth(roles: [OWNER, ADMIN, STAFF, VIEWER])
  inboxCounts: InboxCounts! @auth(roles: [OWNER, ADMIN, STAFF, VIEWER])
  messageTemplates(category: TemplateCategory): [MessageTemplate!]! @auth(roles: [OWNER, ADMIN, STAFF, VIEWER])
}
extend type Mutation {
  sendMessage(input: SendMessageInput!): Message! @auth(roles: [OWNER, ADMIN, STAFF])
  assignConversation(id: UUID!, userId: UUID): Conversation! @auth(roles: [OWNER, ADMIN, STAFF])
  setConversationStatus(id: UUID!, status: ConversationStatus!): Conversation! @auth(roles: [OWNER, ADMIN, STAFF])
  markConversationRead(id: UUID!): Conversation! @auth(roles: [OWNER, ADMIN, STAFF])
  addConversationLabel(id: UUID!, label: String!): Conversation! @auth(roles: [OWNER, ADMIN, STAFF])
  removeConversationLabel(id: UUID!, label: String!): Conversation! @auth(roles: [OWNER, ADMIN, STAFF])
  linkConversationCustomer(id: UUID!, customerId: UUID!): Conversation! @auth(roles: [OWNER, ADMIN, STAFF])
  upsertMessageTemplate(id: UUID, input: MessageTemplateInput!): MessageTemplate! @auth(roles: [OWNER, ADMIN])
  deleteMessageTemplate(id: UUID!): Boolean! @auth(roles: [OWNER, ADMIN])
}
