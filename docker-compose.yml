services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psaas
      POSTGRES_PASSWORD: psaas
      POSTGRES_DB: psaas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U psaas"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
