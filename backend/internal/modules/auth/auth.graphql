type User {
  id: UUID!
  name: String!
  email: String
  phone: String
  avatarUrl: String
  isPlatformAdmin: Boolean!
  memberships: [Membership!]!
  createdAt: Time!
}
type Membership { id: UUID! tenant: Tenant! role: Role! commissionBps: Int! status: String! }
"""
In cookie mode (X-Auth-Mode: cookie, the web app) both tokens are httpOnly cookies and
accessToken/refreshToken are null (ADR-011); other clients get them in the body.
"""
type AuthPayload {
  accessToken: String
  refreshToken: String
  "When the access token expires: refresh before this."
  accessTokenExpiresAt: Time!
  "The business this session is scoped to (null until the user has one)."
  tenantId: UUID
  user: User!
}
"""Public preview of a pending invite, looked up by token."""
type InvitePreview { tenantName: String! role: Role! inviteeName: String! emailHint: String phoneHint: String expiresAt: Time! userExists: Boolean! }

input RegisterInput { name: String! email: String phone: String password: String! businessName: String! }
input LoginInput { identifier: String! password: String! }

extend type Query {
  me: User! @auth
  invite(token: String!): InvitePreview
}
extend type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
  """Reads the refresh token from the argument or, if absent, from the httpOnly cookie."""
  refreshToken(refreshToken: String): AuthPayload!
  logout(refreshToken: String): Boolean!
  """Revokes every session of the current user (bumps token version)."""
  logoutAll: Boolean! @auth
  """Short-lived token for the SSE endpoint GET /events?token=..."""
  createEventsToken: String! @auth
  switchTenant(tenantId: UUID!): AuthPayload! @auth
  changePassword(currentPassword: String!, newPassword: String!): Boolean! @auth
  """Accept a pending invite. New users set a password; existing users prove ownership with their password."""
  acceptInvite(token: String!, password: String!, name: String): AuthPayload!
}
