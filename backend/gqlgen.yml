schema:
  - graph/schema/*.graphql
  - internal/modules/*/*.graphql
exec:
  filename: graph/generated/generated.go
  package: generated
model:
  filename: graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"
omit_slice_element_pointers: true
omit_getters: true
struct_fields_always_pointers: false
resolvers_always_return_pointers: true
models:
  # graph/scalars wraps gqlgen's scalars so bad input -> BAD_USER_INPUT.
  UUID:
    model: provider_saas/graph/scalars.UUID
  Time:
    model: provider_saas/graph/scalars.Time
  Money:
    model: provider_saas/graph/scalars.Money
  JSON:
    # Map first (generated object-only JSON fields); Any for bound fields typed `any`
    # that may hold arrays (attachments, media, paymentNumbers).
    model:
      - github.com/99designs/gqlgen/graphql.Map
      - github.com/99designs/gqlgen/graphql.Any
  ID:
    model: github.com/99designs/gqlgen/graphql.ID
  Int:
    model: github.com/99designs/gqlgen/graphql.Int
  # Hand-written models (graph/model/bound.go) carry FK ids for forceResolver fields.
  Subscription:
    model: provider_saas/graph/model.Subscription
  MasterAccount:
    model: provider_saas/graph/model.MasterAccount
  Slot:
    model: provider_saas/graph/model.Slot
  Invoice:
    model: provider_saas/graph/model.Invoice
  Payment:
    model: provider_saas/graph/model.Payment
  LedgerEntry:
    model: provider_saas/graph/model.LedgerEntry
  ProductStat:
    model: provider_saas/graph/model.ProductStat
  AtRiskCustomer:
    model: provider_saas/graph/model.AtRiskCustomer
  Conversation:
    model: provider_saas/graph/model.Conversation
  Message:
    model: provider_saas/graph/model.Message
  SendMessageInput:
    model: provider_saas/graph/model.SendMessageInput
  Post:
    model: provider_saas/graph/model.Post
  PostTarget:
    model: provider_saas/graph/model.PostTarget
  PostInput:
    model: provider_saas/graph/model.PostInput
  Ticket:
    model: provider_saas/graph/model.Ticket
  TicketComment:
    model: provider_saas/graph/model.TicketComment
  ReminderRule:
    model: provider_saas/graph/model.ReminderRule
  Reminder:
    model: provider_saas/graph/model.Reminder
  Order:
    model: provider_saas/graph/model.Order
  Storefront:
    model: provider_saas/graph/model.Storefront
  PublicStorefront:
    model: provider_saas/graph/model.PublicStorefront
  PublicOrder:
    model: provider_saas/graph/model.PublicOrder
  StorefrontInput:
    model: provider_saas/graph/model.StorefrontInput
  User:
    fields:
      memberships:
        resolver: true
